services:
  backend:
    build: ./backend
    # network_mode: host lets the container reach localhost:9090 (Prometheus)
    # on the EC2 host without extra networking config.
    network_mode: host
    restart: always
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY
      - ASK_HOMEOPS_GLOBAL_MAX_IN_FLIGHT
      - ASK_HOMEOPS_GLOBAL_DAILY_CALL_LIMIT
      - ASK_HOMEOPS_LIMITER_BACKEND
      - ASK_HOMEOPS_REDIS_URL
      - ASK_HOMEOPS_OIDC_ISSUER
      - ASK_HOMEOPS_OIDC_AUDIENCE
      - ASK_HOMEOPS_OIDC_AUDIENCE_CLAIM
      - ASK_HOMEOPS_OIDC_JWKS_URL
      - ASK_HOMEOPS_DIAGNOSTIC_SCOPE
      - ASK_HOMEOPS_TRUSTED_PROXY_IPS=127.0.0.1/32,::1/128
      - ASK_HOMEOPS_TRUSTED_PROXY_HOPS
      - ASK_HOMEOPS_IP_PER_MINUTE_LIMIT
      - ASK_HOMEOPS_USER_PER_MINUTE_LIMIT
      - ASK_HOMEOPS_IP_DAILY_LIMIT
      - ASK_HOMEOPS_USER_DAILY_LIMIT
      - ASK_HOMEOPS_IP_MAX_IN_FLIGHT
      - ASK_HOMEOPS_USER_MAX_IN_FLIGHT
      - GEMINI_INPUT_COST_USD_PER_MILLION_TOKENS
      - GEMINI_OUTPUT_COST_USD_PER_MILLION_TOKENS

  # Shared quota state for the single EC2 deployment. The loopback-only port
  # binding prevents public access; the backend reaches it through host mode.
  valkey:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.listen-address=0.0.0.0:9090"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/"
    restart: always

  grafana:
    image: grafana/grafana:11.5.2
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=https://api.homeops.now/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always

volumes:
  prometheus_data:
  grafana_data:
