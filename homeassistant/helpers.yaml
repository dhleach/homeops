# Home Assistant helper definitions for the staged HomeOps mitigation flow.
#
# The numeric initial values are projections of the validated
# services/insights/rules.yaml `rules.mitigation` section. Keep this file in
# sync with that source; the repository test checks the projection. The
# boolean intentionally starts false so installing this overlay cannot enable
# thermostat writes by itself.

input_boolean:
  mitigation_enabled:
    name: HomeOps mitigation enabled
    icon: mdi:shield-check
    initial: false

input_number:
  homeops_mitigation_furnace_warmup_minutes:
    name: HomeOps mitigation furnace warmup limit
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: box
    initial: 10
  homeops_mitigation_zone_stagger_minutes:
    name: HomeOps mitigation zone stagger duration
    min: 1
    max: 15
    step: 1
    unit_of_measurement: min
    mode: box
    initial: 5

  # These stateful helpers intentionally omit `initial`: Home Assistant restores
  # their last values after a restart so an incident cannot silently reset.
  homeops_mitigation_attempt_count:
    name: HomeOps mitigation attempts in current incident
    min: 0
    max: 3
    step: 1
    mode: box

input_datetime:
  homeops_mitigation_storm_started_at:
    name: HomeOps mitigation storm started at
    has_date: true
    has_time: true

input_text:
  homeops_mitigation_incident_id:
    name: HomeOps mitigation incident ID
    max: 64
  homeops_mitigation_last_rollback_trigger_id:
    name: HomeOps mitigation last rollback trigger ID
    max: 64
