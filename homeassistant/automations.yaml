# Staged HomeOps automation. This file is a valid automations.yaml list but
# is not copied by the normal CI deployment. Enable it only in an isolated HA
# test environment after reviewing docs/mitigation-policy.md.
# The rollback trigger contract is homeops.mitigation.short_cycle_detected.v1
# with incident_id, trigger_event_id, reason, and optional duration/threshold.

- id: homeops_zone_call_stagger
  alias: HomeOps - stagger secondary zone call
  description: >-
    Opt-in, fail-closed staging automation. A newly active secondary zone is
    paused for the configured duration when another zone is already calling
    and the furnace has only recently started. The input_boolean guard is
    deliberately off by default.
  initial_state: false
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.floor_1_heating_call
      from: "off"
      to: "on"
      id: floor_1
    - trigger: state
      entity_id: binary_sensor.floor_2_heating_call
      from: "off"
      to: "on"
      id: floor_2
    - trigger: state
      entity_id: binary_sensor.floor_3_heating_call
      from: "off"
      to: "on"
      id: floor_3
  conditions:
    - condition: state
      entity_id: input_boolean.mitigation_enabled
      state: "on"
    - condition: template
      value_template: >-
        {% set trigger_entity = trigger.entity_id %}
        {% set floor_calls = [
          'binary_sensor.floor_1_heating_call',
          'binary_sensor.floor_2_heating_call',
          'binary_sensor.floor_3_heating_call'
        ] %}
        {% set active_entities = expand(floor_calls)
          | selectattr('state', 'eq', 'on')
          | map(attribute='entity_id') | list %}
        {{ trigger_entity in floor_calls
           and (active_entities | reject('equalto', trigger_entity) | list | length > 0) }}
    - condition: state
      entity_id: binary_sensor.furnace_heating
      state: "on"
    - condition: template
      value_template: >-
        {% set warmup_limit =
          states('input_number.homeops_mitigation_furnace_warmup_minutes') | float(0) %}
        {% set furnace_started =
          as_timestamp(states.binary_sensor.furnace_heating.last_changed, default=0) %}
        {{ warmup_limit > 0
           and furnace_started > 0
           and (as_timestamp(now()) - furnace_started) < warmup_limit * 60 }}
  actions:
    - variables:
        target_climate: >-
          {% set zone_climates = {
            'floor_1': 'climate.floor_1_thermostat',
            'floor_2': 'climate.floor_2_thermostat',
            'floor_3': 'climate.floor_3_thermostat'
          } %}
          {{ zone_climates.get(trigger.id, '') }}
        stagger_minutes: >-
          {{ states('input_number.homeops_mitigation_zone_stagger_minutes') | float(0) }}
        trigger_event_id: >-
          {{ trigger.to_state.context.id | default(trigger.id, true) }}
        mitigation_reason: "secondary_zone_call_during_furnace_warmup"
    - variables:
        original_mode: "{{ states(target_climate) }}"
        original_setpoint: "{{ state_attr(target_climate, 'temperature') }}"
    - condition: template
      value_template: >-
        {{ target_climate != ''
           and original_mode == 'heat'
           and original_setpoint is not none
           and (original_setpoint | float(-1)) >= 0
           and (states('input_number.homeops_mitigation_zone_stagger_minutes')
                | float(0)) > 0 }}
    - condition: template
      value_template: >-
        {% set attempts = states('input_number.homeops_mitigation_attempt_count') | int(-1) %}
        {% set started = as_timestamp(
          states('input_datetime.homeops_mitigation_storm_started_at'), default=0) %}
        {{ attempts >= 0
           and (attempts < 3 or started <= 0
                or (as_timestamp(now()) - started) > 3600) }}
    - variables:
        prior_attempts: >-
          {{ states('input_number.homeops_mitigation_attempt_count') | int(-1) }}
        active_incident: >-
          {% set started = as_timestamp(
            states('input_datetime.homeops_mitigation_storm_started_at'), default=0) %}
          {% set age = as_timestamp(now()) - started %}
          {{ started > 0
             and age >= 0
             and age <= 3600
             and states('input_text.homeops_mitigation_incident_id')
                 not in ['', 'unknown', 'unavailable'] }}
        incident_id: >-
          {% if active_incident | bool %}
            {{ states('input_text.homeops_mitigation_incident_id') }}
          {% else %}
            {{ trigger_event_id }}
          {% endif %}
        attempt_number: >-
          {% if active_incident | bool %}
            {{ [prior_attempts | int(0) + 1, 3] | min }}
          {% else %}
            1
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not (active_incident | bool) }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.homeops_mitigation_attempt_count
              data:
                value: 1
            - action: input_text.set_value
              target:
                entity_id: input_text.homeops_mitigation_incident_id
              data:
                value: "{{ incident_id }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.homeops_mitigation_storm_started_at
              data:
                timestamp: "{{ now().timestamp() }}"
            - action: input_text.set_value
              target:
                entity_id: input_text.homeops_mitigation_last_rollback_trigger_id
              data:
                value: ""
      default:
        - action: input_number.set_value
          target:
            entity_id: input_number.homeops_mitigation_attempt_count
          data:
            value: "{{ attempt_number }}"
    - action: climate.set_hvac_mode
      target:
        entity_id: "{{ target_climate }}"
      data:
        hvac_mode: "off"
    - delay:
        minutes: >-
          {{ stagger_minutes }}
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.mitigation_enabled
              state: "on"
            - condition: state
              entity_id: binary_sensor.furnace_heating
              state: "on"
            - condition: template
              value_template: >-
                {% set setpoint = state_attr(target_climate, 'temperature') %}
                {% set current = state_attr(target_climate, 'current_temperature') %}
                {{ is_state(target_climate, 'off')
                   and original_mode == 'heat'
                   and setpoint is not none
                   and current is not none
                   and (setpoint | float(-1)) == (original_setpoint | float(-2))
                   and (current | float(999)) < (setpoint | float(-1)) }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ target_climate }}"
              data:
                hvac_mode: "heat"
            - event: homeops.mitigation.zone_stagger_applied.v1
              event_data:
                event_type: homeops.mitigation.zone_stagger_applied.v1
                zone: "{{ trigger.id }}"
                reason: "{{ mitigation_reason }}"
                delay_minutes: "{{ stagger_minutes }}"
                trigger_event_id: "{{ trigger_event_id }}"
                incident_id: "{{ incident_id }}"
                attempt_number: "{{ attempt_number }}"
                outcome: applied
      default:
        - event: homeops.mitigation.zone_stagger_applied.v1
          event_data:
            event_type: homeops.mitigation.zone_stagger_applied.v1
            zone: "{{ trigger.id }}"
            reason: resume_gate_failed
            delay_minutes: "{{ stagger_minutes }}"
            trigger_event_id: "{{ trigger_event_id }}"
            incident_id: "{{ incident_id }}"
            attempt_number: "{{ attempt_number }}"
            outcome: skipped

- id: homeops_mitigation_automatic_rollback
  alias: HomeOps - automatic mitigation rollback
  description: >-
    Staged, fail-closed rollback. A qualifying short-cycle event after three
    recorded zone-stagger attempts disables the mitigation guard and emits a
    durable rollback event for the observer/consumer alert path. This
    automation is deliberately disabled by default.
  initial_state: false
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event
      event_type: homeops.mitigation.short_cycle_detected.v1
  conditions:
    - condition: state
      entity_id: input_boolean.mitigation_enabled
      state: "on"
    - condition: template
      value_template: >-
        {% set raw_event_data = trigger.event.data %}
        {% set event_data = raw_event_data if raw_event_data is mapping else {} %}
        {% set attempts = states('input_number.homeops_mitigation_attempt_count') | int(-1) %}
        {% set started = as_timestamp(
          states('input_datetime.homeops_mitigation_storm_started_at'), default=0) %}
        {% set age = as_timestamp(now()) - started %}
        {% set incident_id = states('input_text.homeops_mitigation_incident_id') %}
        {% set trigger_id = event_data.get('trigger_event_id', '') %}
        {% set reason = event_data.get('reason', '') %}
        {{ event_data is mapping
           and attempts >= 3
           and started > 0
           and age >= 0
           and age <= 3600
           and incident_id not in ['', 'unknown', 'unavailable']
           and event_data.get('incident_id') == incident_id
           and trigger_id is string
           and trigger_id | trim != ''
           and reason is string
           and reason | trim != ''
           and trigger_id != states('input_text.homeops_mitigation_last_rollback_trigger_id') }}
  actions:
    - variables:
        rollback_incident_id: "{{ states('input_text.homeops_mitigation_incident_id') }}"
        rollback_failed_attempts: >-
          {{ states('input_number.homeops_mitigation_attempt_count') | int(0) }}
        rollback_trigger_event_id: "{{ trigger.event.data.get('trigger_event_id') }}"
        rollback_reason: >-
          {{ trigger.event.data.get(
            'reason', 'short_cycle_after_three_mitigation_attempts') }}
        rollback_storm_window_started_at: >-
          {{ states('input_datetime.homeops_mitigation_storm_started_at') }}
        rollback_duration_s: "{{ trigger.event.data.get('duration_s', '') }}"
        rollback_threshold_s: "{{ trigger.event.data.get('threshold_s', '') }}"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.mitigation_enabled
    - event: homeops.mitigation.rollback.v1
      event_data:
        event_type: homeops.mitigation.rollback.v1
        incident_id: "{{ rollback_incident_id }}"
        failed_attempts: "{{ rollback_failed_attempts }}"
        reason: "{{ rollback_reason }}"
        trigger_event_id: "{{ rollback_trigger_event_id }}"
        storm_window_started_at: "{{ rollback_storm_window_started_at }}"
        mitigation_enabled: false
        rollback_state: rolled_back
        source_event_type: homeops.mitigation.short_cycle_detected.v1
        short_cycle_duration_s: "{{ rollback_duration_s }}"
        short_cycle_threshold_s: "{{ rollback_threshold_s }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.homeops_mitigation_last_rollback_trigger_id
      data:
        value: "{{ rollback_trigger_event_id }}"
