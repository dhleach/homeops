name: Deploy

on:
  push:
    branches: [ master ]

concurrency:
  group: homeops-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # These are operational addresses, not credentials. Keep them aligned
      # with infra/variables.tf, dashboard/prometheus/prometheus.yml, and
      # docs/architecture.md when infrastructure changes.
      PI_TAILSCALE_IP: 100.115.21.72
      EC2_TAILSCALE_HOST: homeops-ec2
      EC2_PUBLIC_IP: 32.194.69.77

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Connect to Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Verify Tailnet interface
        run: |
          for attempt in 1 2 3 4 5 6; do
            if tailscale ping --timeout=5s "${PI_TAILSCALE_IP}"; then
              exit 0
            fi
            echo "Tailnet peer not ready; retry ${attempt}/6"
            sleep 5
          done
          exit 1

      - name: Select EC2 deployment interface
        run: |
          if tailscale ping --timeout=5s "${EC2_TAILSCALE_HOST}"; then
            echo "EC2_SSH_HOST=${EC2_TAILSCALE_HOST}" >> "$GITHUB_ENV"
            echo "Using the EC2 Tailnet hostname for SSH"
          else
            echo "EC2_SSH_HOST=${EC2_PUBLIC_IP}" >> "$GITHUB_ENV"
            echo "EC2 Tailnet hostname unavailable; using the public EIP fallback"
          fi

      - name: Write SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ${{ runner.temp }}/deploy_key
          chmod 600 ${{ runner.temp }}/deploy_key

      - name: Deploy to Pi
        run: |
          ssh -i ${{ runner.temp }}/deploy_key \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=${{ runner.temp }}/known_hosts \
            "github-deploy@${PI_TAILSCALE_IP}" \
            'bash -s' < deploy/deploy-pi.sh

      - name: Write EC2 SSH key
        run: |
          echo "${{ secrets.EC2_DEPLOY_SSH_KEY }}" > ${{ runner.temp }}/ec2_deploy_key
          chmod 600 ${{ runner.temp }}/ec2_deploy_key

      - name: Deploy backend to EC2
        env:
          # Temporary bridge until the Terraform/SSM credential boundary is
          # applied. These values are written only to the backend's protected
          # runtime environment over the encrypted SSH stream.
          FLEET_DEPLOY_GITHUB_TOKEN: ${{ secrets.FLEET_DEPLOY_GITHUB_TOKEN }}
          FLEET_DEPLOY_API_KEY: ${{ secrets.FLEET_DEPLOY_API_KEY }}
        run: |
          if [[ -z "${FLEET_DEPLOY_GITHUB_TOKEN}" || -z "${FLEET_DEPLOY_API_KEY}" ]]; then
            echo "Fleet Deploy temporary secrets are not configured" >&2
            exit 1
          fi
          {
            printf 'export FLEET_DEPLOY_GITHUB_TOKEN=%q\n' "${FLEET_DEPLOY_GITHUB_TOKEN}"
            printf 'export FLEET_DEPLOY_API_KEY=%q\n' "${FLEET_DEPLOY_API_KEY}"
            cat deploy/deploy-ec2.sh
          } | ssh -i ${{ runner.temp }}/ec2_deploy_key \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=${{ runner.temp }}/known_hosts \
            "ubuntu@${EC2_SSH_HOST}" \
            'bash -s'

      - name: Verify public deployment
        env:
          # The backend restart can briefly leave the active public ingress
          # without a healthy target. Keep the release gate fail-closed while
          # allowing that existing routing layer to converge.
          PUBLIC_SMOKE_INITIAL_DELAY_SECONDS: 60
          PUBLIC_SMOKE_ATTEMPTS: 24
          PUBLIC_SMOKE_RETRY_DELAY_SECONDS: 20
        run: |
          echo "Waiting ${PUBLIC_SMOKE_INITIAL_DELAY_SECONDS}s for public ingress convergence"
          sleep "${PUBLIC_SMOKE_INITIAL_DELAY_SECONDS}"

          for ((attempt = 1; attempt <= PUBLIC_SMOKE_ATTEMPTS; attempt++)); do
            if python3 scripts/deploy_smoke_check.py; then
              echo "Public deployment verified on attempt ${attempt}/${PUBLIC_SMOKE_ATTEMPTS}"
              exit 0
            fi

            if ((attempt < PUBLIC_SMOKE_ATTEMPTS)); then
              echo "Public smoke check failed; retrying in ${PUBLIC_SMOKE_RETRY_DELAY_SECONDS}s (attempt ${attempt}/${PUBLIC_SMOKE_ATTEMPTS})"
              sleep "${PUBLIC_SMOKE_RETRY_DELAY_SECONDS}"
            fi
          done

          echo "Public deployment failed after ${PUBLIC_SMOKE_ATTEMPTS} attempts" >&2
          exit 1
