name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff format check
        run: |
          ruff format --check --diff \
            services/observer/observer.py services/consumer/consumer.py services/consumer/constants.py \
            services/consumer/state.py services/consumer/processors.py services/consumer/alerts.py services/consumer/reporting.py \
            services/consumer/tests/test_cooling_events.py services/consumer/tests/test_cooling_climate_events.py \
            services/consumer/tests/test_cooling_metrics_reporting.py \
            services/consumer/tests/test_mitigation_events.py services/consumer/tests/test_mitigation_rollback.py \
            services/consumer/hvac_context.py services/consumer/proactive_insight.py \
            services/consumer/tests/test_proactive_insight.py services/insights/rules/config.py \
            services/insights/rules/outdoor_temperature_storm.py services/insights/rules/floor_runtime_anomaly.py \
            services/insights/rules/floor_no_response.py services/insights/rules/furnace_session_anomaly.py \
            services/insights/rules/heating_efficiency.py services/insights/rules/efficiency_degradation.py \
            services/insights/rules/time_of_day_pattern.py services/insights/rules/tests/test_config.py \
            services/insights/rules/tests/test_outdoor_temperature_storm.py \
            services/insights/rules/tests/test_rule_enablement.py \
            dashboard/backend/main.py dashboard/backend/security.py dashboard/backend/tests/test_security.py \
            scripts/deploy_smoke_check.py scripts/test_counts.py scripts/validate_anomalies.py \
            scripts/analyze_multi_zone_impact.py scripts/floor_hourly_heatmap.py scripts/floor_runtime_trend.py \
            scripts/furnace_temp_scatter.py scripts/generate_report.py scripts/runtime_temp_anomalies.py \
            scripts/zone_heat_loss.py scripts/runtime_per_degree.py scripts/time_to_temp.py \
            scripts/thermal_query.py scripts/scheduling_query.py scripts/export_thermal_dataset.py \
            scripts/mitigation_e2e.py \
            scripts/tests/test_deploy_smoke_check.py scripts/tests/test_grafana_dashboards.py \
            scripts/tests/test_bob_evaluation_publication.py \
            scripts/tests/test_test_counts.py \
            scripts/tests/test_validate_anomalies.py scripts/tests/test_analyze_multi_zone_impact.py \
            scripts/tests/test_floor_hourly_heatmap.py scripts/tests/test_data_model_docs.py \
            scripts/tests/test_homeassistant_automation.py \
            scripts/tests/test_furnace_temp_scatter.py scripts/tests/test_generate_report.py \
            scripts/tests/test_runtime_temp_anomalies.py scripts/tests/test_zone_heat_loss.py \
            scripts/tests/test_runtime_per_degree.py scripts/tests/test_time_to_temp.py \
            scripts/tests/test_mitigation_e2e.py scripts/tests/test_thermal_query.py \
            scripts/tests/test_scheduling_query.py scripts/tests/test_export_thermal_dataset.py \
            scripts/tests/test_thermal_prediction_targets_docs.py \
            scripts/tests/test_thermal_prediction_dataset_docs.py \
            scripts/tests/test_thermal_prediction_features_docs.py \
            scripts/tests/test_thermal_prediction_evaluation_docs.py
      - name: Run ruff checks
        run: |
          ruff check \
            services/observer/observer.py services/consumer/consumer.py services/consumer/constants.py \
            services/consumer/state.py services/consumer/processors.py services/consumer/alerts.py services/consumer/reporting.py \
            services/consumer/tests/test_cooling_events.py services/consumer/tests/test_cooling_climate_events.py \
            services/consumer/tests/test_cooling_metrics_reporting.py \
            services/consumer/tests/test_mitigation_events.py services/consumer/tests/test_mitigation_rollback.py \
            services/consumer/hvac_context.py services/consumer/proactive_insight.py \
            services/consumer/tests/test_proactive_insight.py services/insights/rules/config.py \
            services/insights/rules/outdoor_temperature_storm.py services/insights/rules/floor_runtime_anomaly.py \
            services/insights/rules/floor_no_response.py services/insights/rules/furnace_session_anomaly.py \
            services/insights/rules/heating_efficiency.py services/insights/rules/efficiency_degradation.py \
            services/insights/rules/time_of_day_pattern.py services/insights/rules/tests/test_config.py \
            services/insights/rules/tests/test_outdoor_temperature_storm.py \
            services/insights/rules/tests/test_rule_enablement.py \
            dashboard/backend/main.py dashboard/backend/security.py dashboard/backend/tests/test_security.py \
            scripts/deploy_smoke_check.py scripts/test_counts.py scripts/validate_anomalies.py \
            scripts/analyze_multi_zone_impact.py scripts/floor_hourly_heatmap.py scripts/floor_runtime_trend.py \
            scripts/furnace_temp_scatter.py scripts/generate_report.py scripts/runtime_temp_anomalies.py \
            scripts/zone_heat_loss.py scripts/runtime_per_degree.py scripts/time_to_temp.py \
            scripts/thermal_query.py scripts/scheduling_query.py scripts/export_thermal_dataset.py \
            scripts/mitigation_e2e.py \
            scripts/tests/test_deploy_smoke_check.py scripts/tests/test_grafana_dashboards.py \
            scripts/tests/test_bob_evaluation_publication.py \
            scripts/tests/test_test_counts.py \
            scripts/tests/test_validate_anomalies.py scripts/tests/test_analyze_multi_zone_impact.py \
            scripts/tests/test_floor_hourly_heatmap.py scripts/tests/test_data_model_docs.py \
            scripts/tests/test_homeassistant_automation.py \
            scripts/tests/test_furnace_temp_scatter.py scripts/tests/test_generate_report.py \
            scripts/tests/test_runtime_temp_anomalies.py scripts/tests/test_zone_heat_loss.py \
            scripts/tests/test_runtime_per_degree.py scripts/tests/test_time_to_temp.py \
            scripts/tests/test_mitigation_e2e.py scripts/tests/test_thermal_query.py \
            scripts/tests/test_scheduling_query.py scripts/tests/test_export_thermal_dataset.py \
            scripts/tests/test_thermal_prediction_targets_docs.py \
            scripts/tests/test_thermal_prediction_dataset_docs.py \
            scripts/tests/test_thermal_prediction_features_docs.py \
            scripts/tests/test_thermal_prediction_evaluation_docs.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio respx PyYAML
          pip install -r services/consumer/requirements.txt
          pip install -r services/observer/requirements.txt
          pip install -r dashboard/backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        run: npm ci
      - name: Run Python tests
        env:
          PYTHONPATH: services/consumer:services/observer:services/insights:dashboard/backend:scripts
        run: |
          pytest --import-mode=importlib --junitxml=python-tests.xml \
            services/observer/tests \
            services/consumer/tests \
            services/insights/rules/tests \
            dashboard/backend/tests \
            scripts/tests
      - name: Run frontend tests
        working-directory: dashboard/frontend
        env:
          NODE_ENV: test
        run: npm test -- --reporter=json --outputFile=../../react-tests.json
      - name: Verify canonical test count
        run: |
          python scripts/test_counts.py \
            --python-junit python-tests.xml \
            --react-json react-tests.json \
            --expected docs/test-counts.json \
            --readme README.md \
            --output test-counts.json
          cat test-counts.json

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell scripts
        run: bash -n deploy/deploy-ec2.sh deploy/deploy-pi.sh deploy/tests/test-deploy-ec2.sh deploy/tests/test-pi-sudoers.sh
      - name: Run deployment shell tests
        run: |
          bash deploy/tests/test-deploy-ec2.sh
          bash deploy/tests/test-pi-sudoers.sh
