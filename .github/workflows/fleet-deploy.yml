name: Fleet Deploy Trusted Artifact

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Manifest deployment ID to validate"
        required: true
        type: string
      event_commit_sha:
        description: "Full commit SHA on the fleet-deployments manifest branch"
        required: true
        type: string

# This workflow can read repository data and upload its bounded result.  It
# deliberately has no permission to write contents, dispatch workflows, or
# change deployments.
permissions:
  contents: read

jobs:
  trusted-artifact:
    name: Validate manifest and build profile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      EVENT_COMMIT_SHA: ${{ inputs.event_commit_sha }}
      MANIFEST_BRANCH: fleet-deployments
      MANIFEST_PATH: manifests/${{ inputs.deployment_id }}.json

    steps:
      - name: Require protected master dispatch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" || "${GITHUB_REF_PROTECTED:-false}" != "true" ]]; then
            echo "This workflow must be dispatched from protected master; got ${GITHUB_REF} (protected=${GITHUB_REF_PROTECTED:-false})" >&2
            exit 1
          fi

      - name: Checkout trusted master code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Set up trusted Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate dispatch identity inputs
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m deploy_demo.trusted_artifact validate-inputs \
            --deployment-id "${DEPLOYMENT_ID}" \
            --event-commit-sha "${EVENT_COMMIT_SHA}"

      - name: Read only the exact manifest commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetch branch objects for ancestry verification only.  Never check
          # out or execute code from this writable manifest branch.
          git -c "http.extraHeader=Authorization: Bearer ${GITHUB_TOKEN}" fetch \
            --no-tags --prune origin \
            "refs/heads/${MANIFEST_BRANCH}:refs/remotes/origin/${MANIFEST_BRANCH}"
          git cat-file -e "${EVENT_COMMIT_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${EVENT_COMMIT_SHA}" \
            "refs/remotes/origin/${MANIFEST_BRANCH}"; then
            echo "event_commit_sha is not an ancestor of ${MANIFEST_BRANCH}" >&2
            exit 1
          fi
          git cat-file -e "${EVENT_COMMIT_SHA}:${MANIFEST_PATH}"
          if [[ "$(git cat-file -t "${EVENT_COMMIT_SHA}:${MANIFEST_PATH}")" != "blob" ]]; then
            echo "manifest path is not a regular blob" >&2
            exit 1
          fi
          git show "${EVENT_COMMIT_SHA}:${MANIFEST_PATH}" > "${RUNNER_TEMP}/fleet-manifest.json"
          echo "FLEET_MANIFEST_PATH=${RUNNER_TEMP}/fleet-manifest.json" >> "${GITHUB_ENV}"
          echo "Read manifest data from ${MANIFEST_BRANCH}@${EVENT_COMMIT_SHA}"

      # This is intentionally before tool installation, lint, tests, and
      # artifact generation.  Invalid manifest data stops the job here.
      - name: Validate exact manifest before build gates
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m deploy_demo.trusted_artifact validate \
            --manifest "${FLEET_MANIFEST_PATH}" \
            --deployment-id "${DEPLOYMENT_ID}" \
            --event-commit-sha "${EVENT_COMMIT_SHA}"

      - name: Install trusted workflow test tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Lint trusted workflow support
        run: |
          set -euo pipefail
          ruff format --check \
            deploy_demo/__init__.py deploy_demo/trusted_artifact.py \
            deploy_demo/tests/test_trusted_artifact.py \
            scripts/tests/test_fleet_deploy_workflow.py
          ruff check \
            deploy_demo/__init__.py deploy_demo/trusted_artifact.py \
            deploy_demo/tests/test_trusted_artifact.py \
            scripts/tests/test_fleet_deploy_workflow.py

      - name: Run trusted workflow tests
        run: |
          PYTHONPATH=. pytest --import-mode=importlib \
            deploy_demo/tests/test_trusted_artifact.py \
            scripts/tests/test_fleet_deploy_workflow.py

      - name: Build immutable profile artifact
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m deploy_demo.trusted_artifact build \
            --manifest "${FLEET_MANIFEST_PATH}" \
            --deployment-id "${DEPLOYMENT_ID}" \
            --event-commit-sha "${EVENT_COMMIT_SHA}" \
            --artifact-out "${RUNNER_TEMP}/profile.json" \
            --provenance-out "${RUNNER_TEMP}/profile-provenance.json"

      - name: Display separate event and artifact identities
        run: |
          set -euo pipefail
          echo "Event commit SHA: ${EVENT_COMMIT_SHA}"
          echo "Profile artifact SHA-256: $(sha256sum "${RUNNER_TEMP}/profile.json" | cut -d' ' -f1)"
          cat "${RUNNER_TEMP}/profile-provenance.json"

      - name: Upload immutable profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-profile-${{ inputs.deployment_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/profile.json
            ${{ runner.temp }}/profile-provenance.json
          if-no-files-found: error
          retention-days: 30
